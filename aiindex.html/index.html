<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPU AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030712; /* neutral_950 dark background */
            color: #e0f2fe; /* primary_900 creamy light blue text */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 80vh;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: #0f172a;
            border-bottom: 1px solid #1f2937;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #f8fafc;
            font-weight: 600;
        }

        .chat-header p {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-start;
            background-color: #1f2937;
            color: #f3f4f6;
            border-bottom-left-radius: 2px;
        }

        .bot-message {
            align-self: flex-end;
            background-color: #3b82f6; /* primary_500 blue */
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 16px;
            background-color: #0f172a;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-btn {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background-color: #374151;
            color: #fff;
        }

        .chat-input {
            flex-grow: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input::placeholder {
            color: #6b7280;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .send-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #2563eb;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            background-color: #030712;
            border-top: 1px solid #1f2937;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #1f2937;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>LPU AI Assistant</h1>
        <p>Created by Rajan</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message user-message">
            Hello! What can you do?
        </div>
        <div class="message bot-message">
            Hello! I am your LPU AI Assistant. I can help answer questions, generate text, write code, or process images you upload.
        </div>
    </div>

    <div class="chat-input-area">
        <button class="upload-btn" title="Upload Image or File">📎</button>
        <input type="text" class="chat-input" id="userInput" placeholder="Type a message...">
        <button class="send-btn" id="sendBtn">Submit</button>
    </div>

    <div class="chat-actions">
        <button class="action-btn" onclick="clearChat()">Clear</button>
        <button class="action-btn">Undo</button>
        <button class="action-btn">Retry</button>
    </div>
</div>

<script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');

    function sendMessage() {
        const text = userInput.value.trim();
        if (text !== "") {
            // Append User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatMessages.appendChild(userDiv);

            userInput.value = '';

            // Simulate Bot Response
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                botDiv.textContent = "This is a static HTML interface preview.";
                chatMessages.appendChild(botDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 500);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    function clearChat() {
        chatMessages.innerHTML = '';
    }
</script>

</body>
</html>
